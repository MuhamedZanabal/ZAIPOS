services:
  zaipos:
    build:
      # Repository root containing the Dockerfile.
      context: ../../
      dockerfile: Dockerfile
      args:
        # Public Vite variables are injected at build time.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    image: zaipos-CLIENT:latest
    container_name: zaipos-CLIENT
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
