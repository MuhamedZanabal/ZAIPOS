server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache: assets con hash en el nombre → largo plazo
    location ~* \.(js|css|woff2?|ico|png|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker sin caché (para que el PWA pueda actualizarse)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta desconocida → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health-check para Dokploy
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
