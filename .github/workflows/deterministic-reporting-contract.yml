name: Deterministic Reporting Contract

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/test-deterministic-reporting-postgres.mjs"
      - ".github/workflows/deterministic-reporting-contract.yml"
      - "src/modules/dashboard/**"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/test-deterministic-reporting-postgres.mjs"
      - ".github/workflows/deterministic-reporting-contract.yml"
      - "src/modules/dashboard/**"

jobs:
  deterministic-reporting-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply production PostgreSQL migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs
      - name: Verify deterministic reporting contract
        shell: bash
        run: |
          set +e
          node scripts/test-deterministic-reporting-postgres.mjs > deterministic-reporting.log 2>&1
          status=$?
          cat deterministic-reporting.log
          exit "$status"
      - name: Preserve deterministic reporting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-reporting-${{ github.sha }}
          path: deterministic-reporting.log
          if-no-files-found: ignore
          retention-days: 2
