name: Authorization Surface Census
on:
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'supabase/**'
      - 'scripts/test-authorization-surface-census.mjs'
      - 'scripts/authorization-surface-census.test.mjs'
      - 'scripts/authorization-census-guard.mjs'
      - 'scripts/authorization-census-guard.test.mjs'
      - 'scripts/authorization-surface-baseline.json'
      - 'scripts/authorization-permission-contract.json'
      - 'scripts/authorization-permission-contract.test.mjs'
      - 'scripts/authorization-runtime-contract.mjs'
      - 'scripts/authorization-runtime-contract.test.mjs'
      - 'scripts/test-canonical-authorization-helpers-postgres.mjs'
      - 'scripts/test-storage-authorization-postgres.mjs'
      - 'scripts/test-ai-order-agent-authorization.mjs'
      - 'scripts/test-process-email-queue-authorization.mjs'
      - 'scripts/test-business-export-authorization-postgres.mjs'
      - 'scripts/test-create-user-branch-authorization.mjs'
      - 'scripts/test-evolution-webhook-authentication.mjs'
      - 'scripts/test-send-whatsapp-authorization.mjs'
      - '.github/workflows/authorization-surface-census.yml'
  workflow_dispatch:
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply production PostgreSQL migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs
      - name: Verify canonical authentication, tenant, branch, role and account-state authority
        run: node scripts/test-canonical-authorization-helpers-postgres.mjs
      - name: Verify storage tenant-membership authorization
        run: node scripts/test-storage-authorization-postgres.mjs
      - name: Verify business export authorization matrix
        run: node scripts/test-business-export-authorization-postgres.mjs
      - name: Verify create-user branch authorization
        run: node --test scripts/test-create-user-branch-authorization.mjs
      - name: Verify disabled AI order-agent authentication boundary
        run: node --test scripts/test-ai-order-agent-authorization.mjs
      - name: Verify email worker exact service credential
        run: node --test scripts/test-process-email-queue-authorization.mjs
      - name: Verify device activation Edge authority
        run: node scripts/test-device-activation-edge-contract.mjs
      - name: Verify device rotation Edge authority
        run: node scripts/test-device-rotation-edge-contract.mjs
      - name: Verify POS PIN Edge authority
        run: node scripts/test-pos-pin-edge-contract.mjs
      - name: Verify knowledge embedding Edge authority
        run: node --test scripts/test-embed-knowledge-authorization.mjs
      - name: Verify invoice processing Edge authority
        run: node --test scripts/test-process-invoice-authorization.mjs
      - name: Verify Evolution webhook authentication
        run: node --test scripts/test-evolution-webhook-authentication.mjs
      - name: Verify WhatsApp authorization boundary
        run: node scripts/test-send-whatsapp-authorization.mjs
      - name: Test route permission segment boundaries
        run: npx vitest run src/lib/roles-boundary.test.ts
      - name: Test census drift and permission-contract guards
        run: node --test scripts/authorization-census-guard.test.mjs scripts/authorization-surface-census.test.mjs scripts/authorization-permission-contract.test.mjs scripts/authorization-runtime-contract.test.mjs
      - name: Enumerate authorization-sensitive surfaces
        run: node scripts/test-authorization-surface-census.mjs > authorization-surface-census.json
      - name: Validate census JSON
        run: node -e "const x=require('./authorization-surface-census.json'); if(!x.surfaces?.length) process.exit(1); console.log(x.counts)"
      - name: Emit exact runtime authorization classification
        run: node scripts/authorization-runtime-contract.mjs authorization-surface-census.json > authorization-runtime-classification.json
      - name: Validate exact runtime classification
        run: node -e "const x=require('./authorization-runtime-classification.json'); if(x.status!=='verified-runtime-classification'||x.runtime_occurrence_count!==433||x.entries?.length!==433) process.exit(1); console.log({status:x.status,runtime:x.runtime_occurrence_count})"
      - uses: actions/upload-artifact@v4
        with:
          name: authorization-surface-census
          path: |
            authorization-surface-census.json
            authorization-runtime-classification.json
          if-no-files-found: error
      - name: Reject unreviewed census changes
        run: node scripts/authorization-census-guard.mjs authorization-surface-census.json scripts/authorization-surface-baseline.json
