name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Audit ZAIPOS Bahrain localization
        run: node scripts/audit-localization.mjs

      - name: Validate migrations
        run: npm run validate:migrations

      - name: Test exact-money migration
        run: npm run test:migrations:money

      - name: Test atomic checkout migration
        run: npm run test:migrations:checkout

      - name: Test checkout operation RLS
        run: npm run test:migrations:checkout-rls

      - name: Test return/refund lifecycle
        run: npm run test:migrations:returns

      - name: Test customer return loyalty guard
        run: npm run test:migrations:return-loyalty

      - name: Test void sale lifecycle
        run: npm run test:migrations:void

      - name: Test return/void access hardening
        run: npm run test:migrations:return-void-access

      - name: Test cash-session reconciliation
        run: node scripts/test-cash-session-reconciliation.mjs

      - name: Test inventory exactly-once lifecycle
        run: npm run test:migrations:inventory-idempotency

      - name: Test inventory client v2 cutover
        run: node scripts/test-inventory-client-cutover.mjs

      - name: Test production PostgreSQL migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs

      - name: Test tenant-branch structural integrity
        run: node scripts/test-tenant-branch-integrity.mjs

      - name: Test real checkout concurrency
        run: node scripts/test-checkout-concurrency.mjs

      - name: Test transaction authorization and audit
        run: node scripts/test-transaction-auth-audit.mjs

      - name: Test device registry authorization
        run: npm run test:migrations:devices

      - name: Test historical receipt reprint
        run: npm run test:migrations:receipt-reprint

      - name: Test held cart lifecycle
        run: npm run test:migrations:held-carts

      - name: Test price override and manager approval
        run: npm run test:migrations:price-override

      - name: Test POS transaction and hardware E2E
        run: npx vitest run src/modules/pos/POS.transaction-e2e.test.tsx

      - name: Test production release contract
        run: npm run test:release-contract

      - name: Validate Windows icon resource
        run: npm run test:windows-icon

      - name: Test P0 AI safety
        run: npm run test:ai-safety

      - name: Test P0 AI RPC lockdown
        run: npm run test:migrations:ai-lockdown

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  windows-package:
    name: windows-package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package unsigned Windows validation installer
        run: npm run package:windows

      - name: Preserve validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAIPOS-${{ github.sha }}-windows-validation
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 14
