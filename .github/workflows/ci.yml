name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Audit ZAIPOS Bahrain localization
        run: node scripts/audit-localization.mjs
      - name: Validate migrations
        run: npm run validate:migrations
      - name: Test exact-money migration
        run: npm run test:migrations:money
      - name: Test atomic checkout migration
        run: npm run test:migrations:checkout
      - name: Test checkout operation RLS
        run: npm run test:migrations:checkout-rls
      - name: Test return/refund lifecycle
        run: npm run test:migrations:returns
      - name: Test customer return loyalty guard
        run: npm run test:migrations:return-loyalty
      - name: Test void sale lifecycle
        run: npm run test:migrations:void
      - name: Test return/void access hardening
        run: npm run test:migrations:return-void-access
      - name: Test cash-session reconciliation
        run: node scripts/test-cash-session-reconciliation.mjs
      - name: Test inventory exactly-once lifecycle
        run: npm run test:migrations:inventory-idempotency
      - name: Test inventory client v2 cutover
        run: node scripts/test-inventory-client-cutover.mjs
      - name: Test production PostgreSQL migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs
      - name: Test tenant-branch structural integrity
        run: node scripts/test-tenant-branch-integrity.mjs
      - name: Test real checkout concurrency
        run: node scripts/test-checkout-concurrency.mjs
      - name: Test offline checkout reconciliation adversarially
        run: node scripts/test-offline-checkout-reconciliation-postgres.mjs
      - name: Test transaction authorization and audit
        run: node scripts/test-transaction-auth-audit.mjs
      - name: Test count import retry after intervening stock movement
        run: node scripts/test-inventory-count-retry-postgres.mjs
      - name: Test complete and scoped business exports
        run: node scripts/test-business-export-postgres.mjs
      - name: Test cash mutation authority
        run: node scripts/test-cash-mutation-authority-postgres.mjs
      - name: Test cash movement replay
        run: node scripts/test-cash-replay-postgres.mjs
      - name: Test cash session authorization and input boundaries
        run: node scripts/test-cash-session-boundaries-postgres.mjs
      - name: Test device registry authorization
        shell: bash
        run: |
          set +e
          npm run test:migrations:devices > device-registry-test.log 2>&1
          status=$?
          cat device-registry-test.log
          exit "$status"
      - name: Preserve device registry failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-registry-failure-${{ github.sha }}
          path: device-registry-test.log
          if-no-files-found: error
          retention-days: 2
      - name: Test historical receipt reprint
        run: npm run test:migrations:receipt-reprint
      - name: Test held cart lifecycle
        run: npm run test:migrations:held-carts
      - name: Test price override and manager approval
        run: npm run test:migrations:price-override
      - name: Test POS PIN security
        run: npm run test:migrations:pos-pin
      - name: Test product barcode ledger and collisions
        run: npm run test:migrations:product-barcodes
      - name: Test product price, cost, and historical COGS
        run: npm run test:migrations:product-financial-history
      - name: Test Bahrain pricing policy
        run: npm run test:migrations:bahrain-pricing-policy
      - name: Test duplicate product merge
        shell: bash
        run: |
          set +e
          npm run test:migrations:product-merge > product-merge-test.log 2>&1
          status=$?
          cat product-merge-test.log
          exit "$status"
      - name: Preserve duplicate merge failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-merge-failure-${{ github.sha }}
          path: product-merge-test.log
          if-no-files-found: ignore
          retention-days: 2
      - name: Audit duplicate merge product references
        run: node scripts/test-product-merge-reference-safety.mjs
      - name: Test product merge supplier catalogue safety
        run: node scripts/test-product-merge-supplier-catalogue-safety.mjs
      - name: Test catalogue import
        run: npm run test:migrations:catalogue-import
      - name: Test inventory lots expiry
        run: node scripts/test-inventory-lots-expiry-postgres.mjs
      - name: Test stocktake cycle count
        run: node scripts/test-stocktake-cycle-count-postgres.mjs
      - name: Test inventory current-cost valuation
        run: node scripts/test-inventory-current-cost-valuation-postgres.mjs
      - name: Test supplier subledger
        run: node scripts/test-supplier-subledger-postgres.mjs
      - name: Test supplier product catalogue
        run: node scripts/test-supplier-product-catalogue-runtime-postgres.mjs
      - name: Test customer loyalty ledger
        run: node scripts/test-customer-loyalty-ledger-runtime-postgres.mjs
      - name: Test customer profiles and addresses
        run: node scripts/test-customer-profiles-addresses-postgres.mjs
      - name: Test customer credit subledger
        run: node scripts/test-customer-credit-subledger-postgres.mjs
      - name: Test deterministic reporting
        run: node scripts/test-deterministic-reporting-postgres.mjs
      - name: Test delivery financial authority
        run: node scripts/test-delivery-financial-authority-postgres.mjs
      - name: Test operational alerts
        run: node scripts/test-operational-alerts-postgres.mjs
      - name: Test cash till intelligence
        run: node scripts/test-cash-till-intelligence-postgres.mjs
      - name: Test AI read controller
        run: node scripts/test-ai-read-controller.mjs
      - name: Test AI action approval
        run: node scripts/test-ai-action-approval.mjs
      - name: Test dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  windows-package:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run electron:build -- --win --dir
