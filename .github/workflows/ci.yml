name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit ZAIPOS Bahrain localization
        run: node scripts/audit-localization.mjs

      - name: Validate migrations
        run: npm run validate:migrations

      - name: Test exact-money migration
        run: npm run test:migrations:money

      - name: Test atomic checkout migration
        run: npm run test:migrations:checkout

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
