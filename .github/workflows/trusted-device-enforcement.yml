name: Trusted Device Enforcement Contract
on:
  pull_request:
    paths:
      - 'scripts/test-trusted-device-enforcement-postgres.mjs'
      - 'scripts/test-device-enrollment-approval-postgres.mjs'
      - '.github/workflows/trusted-device-enforcement.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:
jobs:
  trusted-device:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply production migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs
      - name: Verify manager-only enrollment approval
        run: node scripts/test-device-enrollment-approval-postgres.mjs
      - name: Verify enrolled and revoked device authority
        run: node scripts/test-trusted-device-enforcement-postgres.mjs
