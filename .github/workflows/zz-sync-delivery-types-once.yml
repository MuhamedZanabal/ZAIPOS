name: Sync Delivery Types Once

on:
  push:
    branches:
      - feat/p1-delivery-financial-authority
    paths:
      - ".github/workflows/zz-sync-delivery-types-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-delivery-financial-authority
          fetch-depth: 1
      - name: Synchronize generated delivery schema types
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/integrations/supabase/types.ts';
          let s = fs.readFileSync(path, 'utf8');

          function replaceExact(oldText, newText, expectedCount, label) {
            const count = s.split(oldText).length - 1;
            if (count !== expectedCount) {
              throw new Error(`${label}: expected ${expectedCount} matches, found ${count}`);
            }
            s = s.split(oldText).join(newText);
          }

          // delivery_orders Row plus update_delivery_status return row.
          replaceExact(
            '          delivery_fee: number\n          id: string',
            '          delivery_fee: number\n          delivery_fee_fils: number\n          id: string',
            2,
            'delivery_fee_fils required-row surfaces',
          );

          // delivery_orders Insert and Update.
          replaceExact(
            '          delivery_fee?: number\n          id?: string',
            '          delivery_fee?: number\n          delivery_fee_fils?: number\n          id?: string',
            2,
            'delivery_fee_fils write surfaces',
          );

          const operationsBlock = `      delivery_operations: {\n        Row: {\n          branch_id: string\n          client_mutation_id: string\n          completed_at: string | null\n          created_at: string\n          delivery_order_id: string | null\n          id: string\n          request_payload: Json\n          status: string\n          tenant_id: string\n          user_id: string\n        }\n        Insert: {\n          branch_id: string\n          client_mutation_id: string\n          completed_at?: string | null\n          created_at?: string\n          delivery_order_id?: string | null\n          id?: string\n          request_payload: Json\n          status?: string\n          tenant_id: string\n          user_id: string\n        }\n        Update: {\n          branch_id?: string\n          client_mutation_id?: string\n          completed_at?: string | null\n          created_at?: string\n          delivery_order_id?: string | null\n          id?: string\n          request_payload?: Json\n          status?: string\n          tenant_id?: string\n          user_id?: string\n        }\n        Relationships: [\n          {\n            foreignKeyName: \"delivery_operations_delivery_order_id_fkey\"\n            columns: [\"delivery_order_id\"]\n            isOneToOne: false\n            referencedRelation: \"delivery_orders\"\n            referencedColumns: [\"id\"]\n          },\n          {\n            foreignKeyName: \"delivery_operations_tenant_branch_fkey\"\n            columns: [\"tenant_id\", \"branch_id\"]\n            isOneToOne: false\n            referencedRelation: \"branches\"\n            referencedColumns: [\"tenant_id\", \"id\"]\n          },\n          {\n            foreignKeyName: \"delivery_operations_tenant_id_fkey\"\n            columns: [\"tenant_id\"]\n            isOneToOne: false\n            referencedRelation: \"tenants\"\n            referencedColumns: [\"id\"]\n          },\n        ]\n      }\n`;

          replaceExact(
            '      digital_orders: {',
            operationsBlock + '      digital_orders: {',
            1,
            'delivery_operations insertion point',
          );

          const v2Block = `      register_delivery_order_v2: {\n        Args: {\n          _address: string\n          _branch_id: string\n          _client_mutation_id: string\n          _customer_id?: string\n          _customer_name?: string\n          _customer_phone?: string\n          _delivery_fee_fils: number\n          _items: Json\n          _neighborhood?: string\n          _notes?: string\n          _tenant_id: string\n        }\n        Returns: string\n      }\n`;

          const legacyEnd = `      register_delivery_order: {\n        Args: {\n          _address: string\n          _branch_id: string\n          _customer_id?: string\n          _customer_name: string\n          _customer_phone: string\n          _delivery_fee?: number\n          _items: Json\n          _neighborhood: string\n          _notes?: string\n          _tenant_id: string\n        }\n        Returns: string\n      }\n`;
          replaceExact(legacyEnd, legacyEnd + v2Block, 1, 'register_delivery_order_v2 insertion point');

          if (!/delivery_fee_fils:\s*number/.test(s)) throw new Error('delivery_fee_fils type missing after patch');
          if (!/register_delivery_order_v2:/.test(s)) throw new Error('register_delivery_order_v2 type missing after patch');
          if (!/delivery_operations:/.test(s)) throw new Error('delivery_operations type missing after patch');

          fs.writeFileSync(path, s);
          NODE

          node scripts/test-delivery-financial-authority.mjs
          rm .github/workflows/zz-sync-delivery-types-once.yml
          git config user.name "ZAIPOS Completion Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/integrations/supabase/types.ts .github/workflows/zz-sync-delivery-types-once.yml
          git diff --cached --check
          git commit -m "fix: synchronize delivery authority generated types"
          git push origin HEAD:feat/p1-delivery-financial-authority
