name: Device Credential Heartbeat Contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test-device-credential-heartbeat-contract.mjs'
      - '.github/workflows/device-credential-heartbeat-contract.yml'
  push:
    branches:
      - 'fix/device-credential-heartbeat-20260919'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credential-bound heartbeat contract
        run: node scripts/test-device-credential-heartbeat-contract.mjs
