name: Normalize ZAIPOS lockfile

on:
  push:
    branches:
      - chore/english-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/english-ui

      - name: Normalize package lock identity
        shell: python
        run: |
          from pathlib import Path
          path = Path("package-lock.json")
          text = path.read_text(encoding="utf-8")
          old = '"name": "poss360t"'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 legacy package-name entries, found {count}")
          path.write_text(text.replace(old, '"name": "zaipos"'), encoding="utf-8")

      - name: Commit normalized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "ZAIPOS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: normalize ZAIPOS package lock identity"
          git push origin HEAD:chore/english-ui
