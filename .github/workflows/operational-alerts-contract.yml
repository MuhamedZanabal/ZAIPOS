name: Operational Alerts Contract

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/test-operational-alerts-postgres.mjs"
      - "src/modules/ai-agent/**"
      - ".github/workflows/operational-alerts-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/test-operational-alerts-postgres.mjs"
      - "src/modules/ai-agent/**"
      - ".github/workflows/operational-alerts-contract.yml"

jobs:
  operational-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply production PostgreSQL migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs
      - name: Verify proactive operational alerts
        id: alerts_contract
        shell: bash
        run: |
          set +e
          node scripts/test-operational-alerts-postgres.mjs > operational-alerts.log 2>&1
          status=$?
          cat operational-alerts.log
          exit "$status"
      - name: Preserve alert diagnostics
        if: failure() && steps.alerts_contract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: operational-alerts-${{ github.sha }}
          path: operational-alerts.log
          if-no-files-found: error
          retention-days: 2
