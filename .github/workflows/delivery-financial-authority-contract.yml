name: Delivery Financial Authority Contract

on:
  pull_request:
    paths:
      - "src/modules/delivery/**"
      - "src/integrations/supabase/types.ts"
      - "supabase/migrations/**"
      - "scripts/test-delivery-financial-authority.mjs"
      - "scripts/test-delivery-financial-authority-postgres.mjs"
      - ".github/workflows/delivery-financial-authority-contract.yml"
  push:
    branches:
      - main
    paths:
      - "src/modules/delivery/**"
      - "src/integrations/supabase/types.ts"
      - "supabase/migrations/**"
      - "scripts/test-delivery-financial-authority.mjs"
      - "scripts/test-delivery-financial-authority-postgres.mjs"
      - ".github/workflows/delivery-financial-authority-contract.yml"

permissions:
  contents: write

jobs:
  delivery-financial-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Synchronize generated delivery financial types once
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/integrations/supabase/types.ts';
          let text = fs.readFileSync(path, 'utf8');
          if (text.includes('register_delivery_order_v2:') && text.includes('delivery_fee_fils: number')) {
            process.exit(0);
          }
          const replacements = [
            [
              '          delivery_fee: number\n          id: string',
              '          delivery_fee: number\n          delivery_fee_fils: number\n          id: string',
            ],
            [
              '          delivery_fee?: number\n          id?: string',
              '          delivery_fee?: number\n          delivery_fee_fils?: number\n          id?: string',
            ],
          ];
          for (const [from, to] of replacements) {
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one generated delivery field pattern, found ${count}: ${from}`);
            text = text.replace(from, to);
          }
          const marker = '      register_delivery_order: {';
          const markerCount = text.split(marker).length - 1;
          if (markerCount !== 1) throw new Error(`Expected exactly one legacy delivery RPC marker, found ${markerCount}`);
          const rpc = `      register_delivery_order_v2: {\n        Args: {\n          _tenant_id: string\n          _branch_id: string\n          _items: Json\n          _address: string\n          _delivery_fee_fils: number\n          _client_mutation_id: string\n          _customer_name?: string\n          _customer_phone?: string\n          _neighborhood?: string\n          _customer_id?: string\n          _notes?: string\n        }\n        Returns: string\n      }\n`;
          text = text.replace(marker, rpc + marker);
          fs.writeFileSync(path, text);
          NODE
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            exit 0
          fi
          node scripts/test-delivery-financial-authority.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "fix: synchronize delivery exact-money database types"
          git push origin HEAD:${{ github.head_ref }}
      - name: Install dependencies
        run: npm ci
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Verify delivery static authority contract
        run: node scripts/test-delivery-financial-authority.mjs
      - name: Apply production PostgreSQL migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs
      - name: Verify delivery PostgreSQL authority contract
        shell: bash
        run: |
          set +e
          node scripts/test-delivery-financial-authority-postgres.mjs > delivery-financial-authority-runtime.log 2>&1
          status=$?
          cat delivery-financial-authority-runtime.log
          exit "$status"
      - name: Preserve delivery runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-financial-authority-${{ github.sha }}
          path: delivery-financial-authority-runtime.log
          if-no-files-found: ignore
          retention-days: 2
