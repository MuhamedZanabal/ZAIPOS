name: AI Action Approval Contract

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/test-ai-action-approval.mjs"
      - "scripts/test-ai-action-approval-ui.mjs"
      - "src/modules/ai-agent/**"
      - "docs/AI_AGENT.md"
      - ".github/workflows/ai-action-approval-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/test-ai-action-approval.mjs"
      - "scripts/test-ai-action-approval-ui.mjs"
      - "src/modules/ai-agent/**"
      - "docs/AI_AGENT.md"
      - ".github/workflows/ai-action-approval-contract.yml"

permissions:
  contents: read

jobs:
  ai-action-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Ensure PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply production PostgreSQL migration chain
        run: node scripts/test-production-migration-chain-supabase.mjs
      - name: Verify AI action approval control plane
        id: contract
        shell: bash
        run: |
          set +e
          : > ai-action-approval.log
          node scripts/test-ai-action-approval.mjs >> ai-action-approval.log 2>&1
          db_status=$?
          node scripts/test-ai-action-approval-ui.mjs >> ai-action-approval.log 2>&1
          ui_status=$?
          cat ai-action-approval.log
          if [ "$db_status" -ne 0 ]; then exit "$db_status"; fi
          exit "$ui_status"
      - name: Preserve failure diagnostics
        if: failure() && steps.contract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ai-action-approval-${{ github.sha }}
          path: ai-action-approval.log
          if-no-files-found: error
          retention-days: 2
